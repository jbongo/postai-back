version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: backend_postgres
    restart: always
    environment:
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: dbpassword
      POSTGRES_DB: backenddb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: backend_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  prisma:
    image: node:18
    container_name: backend_prisma
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "5555:5555"
    command: >
      bash -c "npm install -g prisma && npx prisma studio"
    depends_on:
      - postgres

  backend:
    build: .
    container_name: backend_api
    restart: always
    env_file: .env
    ports:
      - "3333:3333"
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app
    command: ["npm", "run", "start:prod"]

volumes:
  postgres_data:
  redis_data:

